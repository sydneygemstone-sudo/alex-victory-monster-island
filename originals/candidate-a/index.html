<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:,">
<title>Alex &amp; Victory：怪物岛探险</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#0a1428;
               overscroll-behavior:none; touch-action:none; }
  body { font-family:"Trebuchet MS","PingFang SC",system-ui,sans-serif; color:#fff;
         -webkit-user-select:none; user-select:none; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }

  /* ---------------- HUD ---------------- */
  #hud { position:fixed; inset:0; pointer-events:none; z-index:5; }
  .panel { position:absolute; background:rgba(8,16,34,.55); border:1px solid rgba(255,255,255,.15);
           border-radius:14px; padding:9px 14px; backdrop-filter:blur(7px); }

  /* 玩家血条（左上） */
  #pHud { top:calc(12px + env(safe-area-inset-top)); left:calc(12px + env(safe-area-inset-left)); min-width:210px; }
  #pName { font-size:15px; font-weight:bold; letter-spacing:.5px; }
  #pName .tag { font-size:11px; opacity:.72; font-weight:normal; margin-left:6px; }
  .bar { height:13px; background:rgba(255,255,255,.13); border-radius:7px; margin-top:7px; overflow:hidden; }
  .bar > i { display:block; height:100%; width:100%; border-radius:7px; transition:width .18s ease-out; }
  #pFill { background:linear-gradient(90deg,#34d3a0,#8ef0c4); }
  #pFill.low { background:linear-gradient(90deg,#ff3b30,#ff8a5c); }
  #pNum { font-size:11px; opacity:.72; margin-top:4px; font-variant-numeric:tabular-nums; }

  /* 守卫血条（顶部中间，进战才出现） */
  #bossHud { top:calc(12px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
             width:min(460px,62vw); text-align:center; opacity:0; transition:opacity .35s; }
  #bossHud.show { opacity:1; }
  #bossName { font-size:16px; font-weight:bold; letter-spacing:2px; color:#ffb4b4; }
  #bossFill { background:linear-gradient(90deg,#c1272d,#ff6b35,#ffb347); }
  #bossHud .bar { height:16px; }

  /* 水晶计数（右上） */
  #gems { top:calc(12px + env(safe-area-inset-top)); right:calc(12px + env(safe-area-inset-right));
          font-size:19px; font-weight:bold; }
  #gems .n { color:#7fe7ff; }
  #gems .sub { display:block; font-size:10px; opacity:.65; font-weight:normal; margin-top:2px; }

  /* 目标提示（底部中间） */
  #goal { bottom:calc(16px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
          font-size:14px; max-width:78vw; text-align:center; line-height:1.5; transition:opacity .3s; }
  #goal b { color:#ffd54a; }

  /* 守卫状态徽标 */
  #alert { top:calc(96px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
           font-size:15px; font-weight:bold; padding:7px 18px; border-radius:20px; opacity:0;
           transition:opacity .25s; letter-spacing:1px; }
  #alert.show { opacity:1; }
  #alert.warn  { background:rgba(255,180,40,.24); border-color:rgba(255,200,80,.6); color:#ffd88a; }
  #alert.fight { background:rgba(220,40,40,.26); border-color:rgba(255,90,90,.62); color:#ff9c9c;
                 animation:beat 1.1s infinite; }
  @keyframes beat { 50% { opacity:.55; } }

  /* 受击红晕 */
  #vig { position:fixed; inset:0; pointer-events:none; opacity:0; z-index:6;
         box-shadow:inset 0 0 170px 46px rgba(255,20,20,.8); transition:opacity .16s; }

  /* ---------------- 触屏控件 ---------------- */
  #touch { position:fixed; inset:0; z-index:7; display:none; }
  #touch.on { display:block; }
  #stickZone { position:absolute; left:0; bottom:0; width:48%; height:72%; }
  #stick { position:absolute; width:128px; height:128px; margin:-64px 0 0 -64px; border-radius:50%;
           background:rgba(255,255,255,.09); border:2px solid rgba(255,255,255,.26);
           opacity:0; transition:opacity .12s; pointer-events:none; }
  #stick.on { opacity:1; }
  #knob { position:absolute; left:50%; top:50%; width:56px; height:56px; margin:-28px 0 0 -28px;
          border-radius:50%; background:rgba(255,255,255,.55); box-shadow:0 0 16px rgba(255,255,255,.3); }
  #stickHint { position:absolute; left:calc(30px + env(safe-area-inset-left));
               bottom:calc(40px + env(safe-area-inset-bottom)); width:132px; height:132px;
               border-radius:50%; border:2px dashed rgba(255,255,255,.36);
               display:flex; align-items:center; justify-content:center; text-align:center;
               font-size:13px; line-height:1.4; color:rgba(255,255,255,.8);
               pointer-events:none; transition:opacity .45s; animation:hintPulse 1.8s infinite; }
  #stickHint.gone { opacity:0; }
  @keyframes hintPulse { 50% { border-color:rgba(255,255,255,.72); } }
  #skillBtn { position:absolute; right:calc(26px + env(safe-area-inset-right));
              bottom:calc(30px + env(safe-area-inset-bottom)); width:116px; height:116px; border-radius:50%;
              background:rgba(90,200,250,.2); border:3px solid rgba(140,225,255,.75);
              display:flex; flex-direction:column; align-items:center; justify-content:center;
              font-size:15px; font-weight:bold; line-height:1.3; text-align:center;
              box-shadow:0 0 26px rgba(90,200,250,.32); }
  #skillBtn .ico { font-size:30px; }
  #skillBtn.cool { opacity:.4; }
  #skillBtn.press { transform:scale(.93); }
  #skillBtn.stage2 { background:rgba(190,120,255,.26); border-color:rgba(214,160,255,.85);
                     box-shadow:0 0 30px rgba(190,120,255,.45); }

  /* ---------------- 遮罩层 ---------------- */
  #ov { position:fixed; inset:0; z-index:10; display:flex; align-items:center; justify-content:center;
        text-align:center; padding:20px;
        background:radial-gradient(circle at 50% 38%, rgba(26,58,102,.9), rgba(4,8,20,.97)); }
  #ov.hidden { display:none; }
  .card { max-width:660px; width:100%; max-height:100%; overflow-y:auto; padding:24px; }
  .card h1 { font-size:clamp(26px,6vw,42px); letter-spacing:1px; margin-bottom:8px;
             text-shadow:0 0 26px rgba(90,200,250,.6); }
  .card h1.win  { color:#ffd54a; text-shadow:0 0 30px rgba(255,213,74,.7); }
  .card h1.lose { color:#ff6b6b; text-shadow:0 0 30px rgba(255,90,90,.6); }
  .card .sub { font-size:clamp(13px,3.3vw,16px); opacity:.86; line-height:1.65; margin-bottom:18px; }

  /* 角色选择卡 */
  .picks { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin:18px 0 20px; }
  .pick { flex:1 1 220px; max-width:260px; padding:16px 14px; border-radius:16px; cursor:pointer;
          background:rgba(255,255,255,.07); border:2px solid rgba(255,255,255,.18);
          transition:transform .14s, border-color .14s, background .14s; }
  .pick:active, .pick.sel { transform:translateY(-3px); }
  .pick.alex.sel { border-color:#5ac8fa; background:rgba(90,200,250,.19); box-shadow:0 0 26px rgba(90,200,250,.3); }
  .pick.vic.sel  { border-color:#c79bff; background:rgba(190,120,255,.19); box-shadow:0 0 26px rgba(190,120,255,.3); }
  .pick .em { font-size:38px; }
  .pick .nm { font-size:20px; font-weight:bold; margin:4px 0 2px; }
  .pick.alex .nm { color:#5ac8fa; } .pick.vic .nm { color:#c79bff; }
  .pick .role { font-size:12px; opacity:.7; }
  .pick .desc { font-size:12.5px; opacity:.86; line-height:1.55; margin-top:9px; text-align:left; }

  .keys { display:flex; gap:9px; justify-content:center; flex-wrap:wrap; margin:14px 0 18px; }
  .key { background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.2);
         border-radius:9px; padding:7px 12px; font-size:12.5px; }
  .key b { display:block; font-size:15px; margin-bottom:2px; color:#5ac8fa; }
  .btn { display:inline-block; font-size:19px; font-weight:bold; padding:13px 40px; border-radius:30px;
         border:2px solid #34d3a0; background:rgba(52,211,160,.2); color:#8ef0c4; cursor:pointer; }
  .btn:active { transform:scale(.96); }
  .btn.dim { opacity:.4; border-color:#889; color:#aab; }
  .stats { display:flex; gap:22px; justify-content:center; flex-wrap:wrap; margin:14px 0 18px; }
  .stat b { display:block; font-size:26px; color:#7fe7ff; }
  .stat span { font-size:11px; opacity:.7; }
  #loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
             background:#0a1428; z-index:20; font-size:17px; opacity:.85; }
  #loading.hidden { display:none; }
</style>
</head>
<body>
<div id="app"></div>

<div id="hud">
  <div id="pHud" class="panel">
    <div id="pName">⚡ ALEX <span class="tag">电力发明家</span></div>
    <div class="bar"><i id="pFill"></i></div>
    <div id="pNum">100 / 100</div>
  </div>

  <div id="bossHud" class="panel">
    <div id="bossName">🐺 三头守卫</div>
    <div class="bar"><i id="bossFill"></i></div>
  </div>

  <div id="gems" class="panel">💎 <span class="n" id="gemN">0</span>
    <span class="sub">水晶（城堡还有 100 颗）</span></div>

  <div id="alert" class="panel"></div>
  <div id="goal" class="panel">下船，穿过<b>海滩</b>，走向<b>山洞</b></div>
</div>
<div id="vig"></div>

<div id="touch">
  <div id="stickZone"></div>
  <div id="stickHint">按住这里<br>拖动跑步</div>
  <div id="stick"><div id="knob"></div></div>
  <div id="skillBtn"><span class="ico" id="skIco">⚡</span><span id="skTxt">电弧</span></div>
</div>

<div id="ov">
  <div class="card" id="card">
    <h1>🏝️ 怪物岛探险</h1>
    <div class="sub">Alex 和 Victory 乘船来到怪物岛。<br>
      穿过海滩，山洞入口有一只<b>巨大的三头守卫</b>——打败它，才能进入雨林。</div>
    <div class="picks">
      <div class="pick alex sel" data-hero="alex">
        <div class="em">⚡</div><div class="nm">ALEX</div><div class="role">电力发明家</div>
        <div class="desc">放出<b>电弧</b>劈向守卫。出手快、冷却短，要贴到中距离才打得到。</div>
      </div>
      <div class="pick vic" data-hero="victory">
        <div class="em">🪐</div><div class="nm">VICTORY</div><div class="role">重力魔法师</div>
        <div class="desc">先<b>让石块悬浮</b>，再按一次<b>甩向守卫</b>。两段操作、伤害更高，远距离也能打。</div>
      </div>
    </div>
    <div class="keys">
      <div class="key"><b>摇杆 / WASD</b>跑动躲避</div>
      <div class="key"><b>技能键 / 空格</b>释放能力</div>
      <div class="key"><b>R</b>重新开始</div>
    </div>
    <div class="btn" id="startBtn">开始探险</div>
  </div>
</div>

<div id="loading">正在加载 3D 场景…</div>

<script src="vendor/three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
