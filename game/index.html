<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#123b43"><title>Monster Island — Tidal Echoes</title><link rel="icon" href="../assets/icon.svg"><link rel="stylesheet" href="game.css"></head><body>
<canvas id="world" aria-hidden="true"></canvas><div class="vignette"></div>
<nav id="top"><a id="hubLink" href="../">↖ <span data-t="home"></span></a><div class="tools"><select id="lang" aria-label="Language"><option value="zh-Hans">简体中文</option><option value="zh-Hant">繁體中文</option><option value="en">English</option></select><button id="pause" data-t="pause" hidden></button></div></nav>
<section class="panel menu" id="menu"><span class="eyebrow" data-t="edition"></span><h1 data-t="title"></h1><p class="lead" data-t="intro"></p>
<div class="heroes"><button id="pickAlex" class="hero selected" aria-pressed="true"><strong><span class="symbol">ϟ</span> ALEX</strong><span data-t="alex"></span><small data-t="alexDesc"></small></button><button id="pickVictory" class="hero" aria-pressed="false"><strong><span class="symbol">◎</span> VICTORY</strong><span data-t="victory"></span><small data-t="victoryDesc"></small></button></div>
<button id="solo" class="primary" data-t="solo"></button><div class="lanrow"><button id="host" data-t="host"></button><input id="roomCode" maxlength="6" inputmode="text" autocomplete="off" aria-label="Room code" placeholder="A1B2C3"><button id="join" data-t="join"></button></div><p id="lanNote" class="small" data-t="lanOnly"></p><p class="small" data-t="saved"></p><p class="small beta" data-t="beta"></p></section>
<section id="lobby" class="panel popup" hidden><span class="eyebrow" data-t="room"></span><h1 id="roomLabel"></h1><p id="lobbyText" data-t="waiting"></p><p data-t="roomHint"></p><button id="launch" class="primary" data-t="launch" hidden></button><button id="leaveLobby" data-t="cancel"></button></section>
<div id="hud" hidden><div class="status"><b id="heroName">ALEX</b><span id="health" class="numeric"></span><div class="meter"><i id="healthFill"></i></div><span id="wallet"></span><small id="partner"></small></div><div id="bossHUD"><span data-t="guardian"></span><b id="challenge" class="numeric"></b><div class="meter boss"><i id="bossFill"></i></div></div><p id="quest"></p></div>
<div id="caption" hidden><p id="introText" data-t="introCaption"></p><button id="skip" data-t="skip"></button></div><div id="toast" role="status"></div>
<div id="controls" hidden><div id="joystick" aria-label="Movement joystick"><div class="direction">↑</div><div id="knob"></div></div><div id="actions"><button id="attack" class="action main"><span class="symbol">ϟ</span><b id="attackLabel"></b><small id="attackCD"></small></button><button id="special" class="action special"><span class="symbol">◎</span><b id="specialLabel"></b><small id="specialCD"></small></button><button id="dash" class="action"><span class="symbol">»</span><b data-t="dash"></b><small id="dashCD"></small></button><button id="anchor" class="action"><span class="symbol">⌄</span><b data-t="anchor"></b><small id="anchorCD"></small></button></div><span id="controlHint" data-t="controls"></span></div>
<section id="overlay" class="panel popup" hidden><span class="eyebrow" data-t="edition"></span><h2 id="overTitle"></h2><p id="overText"></p><div id="shopItems" hidden></div><div class="buttonRow"><button id="resume" class="primary" data-t="resume"></button><button id="retry" class="primary" data-t="retry"></button><button id="rematch" class="primary" data-t="rematch"></button><button id="finish" data-t="finish"></button><button id="returnMenu" data-t="menu"></button></div><fieldset id="settings"><legend data-t="settings"></legend><label><input id="music" type="checkbox" checked><span data-t="music"></span></label><label><input id="sound" type="checkbox" checked><span data-t="sound"></span></label><label><input id="numbers" type="checkbox" checked><span data-t="showNumbers"></span></label><label><input id="motion" type="checkbox"><span data-t="motion"></span></label></fieldset><a id="reviewLink" href="../review.html" data-t="review"></a><button id="resetSave" class="textButton" data-t="reset"></button></section>
<div id="fatal" class="panel popup" hidden role="alert"><h2 data-t="error"></h2><p id="errorDetail"></p><a href="../" data-t="home"></a></div>
<script src="vendor/three.min.js"></script><script type="module" src="client.mjs"></script><div id="damageNumbers" aria-hidden="true"></div><div id="combatStats" class="numeric"></div><div id="cinemaTop" class="letterbox" hidden></div><div id="cinemaBottom" class="letterbox" hidden></div><div id="shotInfo" hidden></div><div id="aimHUD" hidden><b data-t="aimTitle"></b><p data-t="aimHelp"></p><button id="confirmSlam" data-t="confirmSlam"></button><button id="cancelAim" data-t="cancelAim"></button></div></body></html>
